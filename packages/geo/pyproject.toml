[project]
name = "starboard-geo"
version = "0.0.0"
description = "OSM fetch and cache, state graph, snapping and curb assignment"
requires-python = ">=3.12,<3.13"
license = "FSL-1.1-ALv2"
dependencies = [
    "starboard-solver",
    "pydantic>=2.7",
    "osmnx>=2.0",
    "shapely>=2.0",
    "networkx>=3.3",
    "osmium>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starboard"]

[tool.uv.sources]
starboard-solver = { workspace = true }
