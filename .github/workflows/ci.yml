name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      HYPOTHESIS_PROFILE: ci
      STARBOARD_TEST_DATABASE_URL: postgresql+asyncpg://starboard:starboard@localhost:5432/starboard_test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: starboard
          POSTGRES_PASSWORD: starboard  # a throwaway CI database, not a secret
          POSTGRES_DB: starboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not demo and not benchmark"

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # the action lists the pull request's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  banned-terms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write the term list from the masked secret
        env:
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
        run: |
          umask 077
          printf '%s\n' "$BANNED_TERMS" > "$RUNNER_TEMP/banned-terms.txt"
      - name: Scan every tracked file
        env:
          BANNED_TERMS_FILE: ${{ runner.temp }}/banned-terms.txt
        run: sh scripts/check-banned-terms.sh --all
      - name: Scan this pull request's files and commit messages
        if: github.event_name == 'pull_request'
        env:
          BANNED_TERMS_FILE: ${{ runner.temp }}/banned-terms.txt
        run: sh scripts/check-banned-terms.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan pushed commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BANNED_TERMS_FILE: ${{ runner.temp }}/banned-terms.txt
        run: sh scripts/check-banned-terms.sh --range "${{ github.event.before }}..${{ github.sha }}"

  stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the Compose stack
        run: docker compose up -d --build api worker
      - name: The API answers and the worker is running
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          test "$(docker compose ps --status running --services | grep -c '^worker$')" = 1
          test "$(docker compose ps -a --format '{{.Service}} {{.ExitCode}}' | grep '^migrate ')" = "migrate 0"
      - name: Logs
        if: always()
        run: docker compose logs --no-color

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      # pnpm reads its version from apps/web/package.json, so it runs from there.
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: The API types match the API
        run: |
          uv sync --all-packages --locked
          uv run python -m starboard.api.openapi apps/web/openapi.json
          (cd apps/web && pnpm api-types)
          git diff --exit-code -- apps/web/openapi.json apps/web/src/api/schema.d.ts
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
        working-directory: apps/web
