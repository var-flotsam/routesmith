[project]
name = "routesmith"
version = "0.0.0"
description = "Starboard Routing workspace root"
requires-python = ">=3.12,<3.13"
dependencies = ["starboard-solver", "starboard-geo", "starboard-export", "starboard-cli", "starboard-api", "starboard-worker"]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pypdf>=6.21.2",
  "pytest>=8.2",
  "ruff>=0.6",
  "schemathesis>=4",
  "scipy-stubs>=1.18.1.1",
  "types-networkx>=3.6.1.20261024",
  "types-reportlab>=5.0.0.20261008",
  "types-shapely>=2.1.0.20260728",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/cli", "apps/api", "apps/worker"]

[tool.uv.sources]
starboard-solver = { workspace = true }
starboard-geo = { workspace = true }
starboard-export = { workspace = true }
starboard-cli = { workspace = true }
starboard-api = { workspace = true }
starboard-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "ANN"]
ignore = ["PLR2004"]  # comparisons with literals are normal in tests; defaults.py rule covers tunables

[tool.ruff.lint.isort]
known-first-party = ["starboard"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "PLR"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["packages/solver/src", "packages/geo/src", "packages/export/src", "apps/cli/src", "apps/api/src", "apps/worker/src"]
mypy_path = ["packages/solver/src", "packages/geo/src", "packages/export/src", "apps/cli/src", "apps/api/src", "apps/worker/src"]
namespace_packages = true
explicit_package_bases = true

# OR-Tools ships no type information; its calls are confined to solver/optimize.py.
[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = ["--import-mode=importlib", "--strict-markers"]
# OR-Tools' SWIG bindings warn on import under Python 3.12; nothing to act on here.
filterwarnings = ["ignore:builtin type [Ss]wig.*:DeprecationWarning"]
markers = [
  "property: hypothesis property tests of the solver's hard constraints",
  "demo: tests that need the demo town's OSM network (fetched once into cache/)",
  "benchmark: scale runs at 1,000 to 10,000 stops, kept out of the merge gate",
]
