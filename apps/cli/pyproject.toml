[project]
name = "starboard-cli"
version = "0.0.0"
description = "The starboard command line: score and optimize routes from a stop file"
requires-python = ">=3.12,<3.13"
license = "FSL-1.1-ALv2"
dependencies = ["starboard-solver", "starboard-geo"]

[project.scripts]
starboard = "starboard.cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starboard"]

[tool.uv.sources]
starboard-solver = { workspace = true }
starboard-geo = { workspace = true }
