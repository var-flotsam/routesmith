[project]
name = "starboard-api"
version = "0.0.0"
description = "The Starboard Routing API: organizations, routes, uploads, runs and results"
requires-python = ">=3.12,<3.13"
license = "FSL-1.1-ALv2"
dependencies = [
  "starboard-solver",
  "starboard-geo",
  "fastapi>=0.115",
  "email-validator>=2.1",
  "uvicorn>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "arq>=0.26",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starboard"]

[tool.uv.sources]
starboard-solver = { workspace = true }
starboard-geo = { workspace = true }
